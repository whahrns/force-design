<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>힘 설계 설문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F7F5; --grid:#E0E8E3; --ink:#17232C; --muted:#56666F; --line:#C7D3CD; --card:#FFFFFF; --soft:#EAF0EC;
  --ok:#0A8683; --ok-bg:#DDF2F1; --no:#C0306A; --no-bg:#F9E3EC; --pick:#3346A8; --pick-bg:#E7EAF8;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10181D; --grid:#18232A; --ink:#E6EDEF; --muted:#9AAAB2; --line:#2C3A42; --card:#162127; --soft:#1B272E;
    --ok:#3FCFCB; --ok-bg:#0E3533; --no:#FF7EAD; --no-bg:#3E1628; --pick:#8C9CFF; --pick-bg:#1E2447;
  }
}
:root[data-theme="dark"]{
  --paper:#10181D; --grid:#18232A; --ink:#E6EDEF; --muted:#9AAAB2; --line:#2C3A42; --card:#162127; --soft:#1B272E;
  --ok:#3FCFCB; --ok-bg:#0E3533; --no:#FF7EAD; --no-bg:#3E1628; --pick:#8C9CFF; --pick-bg:#1E2447;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;
  word-break:keep-all;overflow-wrap:break-word;line-break:strict;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
h1,h2{font-family:var(--display);font-weight:400;line-height:1.25;margin:0}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pick);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:16px}
header h1{font-size:28px;margin-right:auto}
.in{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:16px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:20px}
.wait{text-align:center;color:var(--muted);padding:40px 20px}
.wait .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:8px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.wait .dot{animation:none}}
.tag{display:inline-block;font-size:14px;border:2px solid var(--line);border-radius:999px;padding:0 10px;color:var(--muted)}
.q{font-family:var(--display);font-size:clamp(24px,6vw,32px);line-height:1.35;margin:10px 0 16px}
.opts{display:grid;gap:10px}
.opts.ox{grid-template-columns:1fr 1fr}
.opt{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--line);background:var(--paper);
  border-radius:14px;padding:12px 14px;cursor:pointer;font-size:18px;overflow:hidden}
.opts.ox .opt{justify-content:center;font-family:var(--display);font-size:56px;line-height:1;padding:18px}
.opt .no{font-family:var(--display);font-size:20px;min-width:1.4em;color:var(--muted)}
.opt .bar{position:absolute;inset:0 auto 0 0;background:var(--soft);z-index:0;transition:width .4s}
.opt > span{position:relative;z-index:1}
.opt .pct{margin-left:auto;font-family:var(--display);font-size:18px}
.opts.ox .opt .pct{position:absolute;right:12px;bottom:6px;font-size:16px}
.opt[aria-pressed="true"]{border-color:var(--pick);background:var(--pick-bg);box-shadow:0 0 0 2px var(--pick) inset}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok) inset}
.opt.right .bar{background:var(--ok-bg)}
.msg{margin:14px 0 0;font-weight:700;min-height:1.7em}
.msg.ok{color:var(--ok)} .msg.no{color:var(--no)}
.note{font-size:14px;color:var(--muted)}
a{color:inherit}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>실시간 설문</h1>
    <label class="note">1학년 <select id="cls" class="in" aria-label="반 고르기"></select></label>
  </header>

  <section class="card" id="pickBox">
    <p style="margin:0">우리 반을 고르면, 선생님이 설문을 열 때 여기에 질문이 나타나요. 이름이나 학번은 묻지 않고, 누가 무엇을 골랐는지 아무도 알 수 없어요.</p>
  </section>

  <section class="card wait" id="waitBox" hidden>
    <p style="margin:0"><span class="dot"></span><span id="waitText">선생님이 설문을 열기를 기다리는 중이에요…</span></p>
  </section>

  <section class="card" id="qBox" hidden>
    <span class="tag" id="qTag"></span>
    <h2 class="q" id="qText"></h2>
    <div class="opts" id="opts" role="group" aria-labelledby="qText"></div>
    <p class="msg" id="msg" role="status"></p>
  </section>

  <p class="note" style="margin-top:18px">답은 마감 전까지 바꿀 수 있어요. 정답과 반 전체 결과는 선생님이 공개하면 보여요. <a href="./">← 모둠 활동으로 돌아가기</a></p>
</main>

<script>
const API='https://scnbrusxjwhehpbjznye.supabase.co/rest/v1/rpc/';
const APIKEY='sb_publishable_yPvmRWZqaGARrsrz2HL1Xw_JEzHDOcB';
const KEY='force-poll-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* 기기 정보: 반, 익명 응답 번호(이 기기에서만 만든 무작위 값), 설문별 내가 고른 답 */
let P={cls:'',voter:'',mine:{}};
try{ Object.assign(P,JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){}
if(!/^[A-Za-z0-9-]{16,64}$/.test(P.voter||'')) P.voter=(crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join(''));
if(!/^1-([1-9]|10)$/.test(P.cls||'')) P.cls='';
const store=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(P)); }catch(e){} };
store();

async function rpc(name,body){
  const r=await fetch(API+name,{method:'POST',headers:{apikey:APIKEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const txt=await r.text(); let j=null; try{ j=txt?JSON.parse(txt):null; }catch(e){}
  if(!r.ok){ const err=new Error((j&&j.message)||('HTTP '+r.status)); throw err; }
  if(j&&j.error){ const err=new Error(j.error); err.code=j.error; throw err; }
  return j;
}

$('#cls').innerHTML='<option value="">반 고르기</option>'+Array.from({length:10},(_,i)=>`<option value="1-${i+1}">${i+1}반</option>`).join('');
$('#cls').value=P.cls;

let cur=null, timer=null, sending=false, lastKey='';
function show(which){ ['pickBox','waitBox','qBox'].forEach(id=>$('#'+id).hidden=id!==which); }

function render(){
  if(!P.cls){ show('pickBox'); return; }
  if(!cur||!cur.active){ show('waitBox'); $('#waitText').textContent='선생님이 설문을 열기를 기다리는 중이에요…'; return; }
  show('qBox');
  const mine=P.mine[cur.session];
  const key=cur.session+'|'+cur.open+'|'+cur.revealed+'|'+mine+'|'+JSON.stringify(cur.counts||[]);
  if(key===lastKey) return;   // 바뀐 것이 없으면 다시 그리지 않음
  lastKey=key;
  $('#qTag').textContent=cur.tag; $('#qText').textContent=cur.question;
  const opts=Array.isArray(cur.options)?cur.options:[], ox=cur.kind==='ox';
  const total=(cur.counts||[]).reduce((a,b)=>a+b,0);
  $('#opts').className='opts'+(ox?' ox':'');
  $('#opts').innerHTML=opts.map((o,i)=>{
    const c=cur.revealed&&cur.counts?cur.counts[i]||0:0, pct=total?Math.round(c/total*100):0;
    const right=cur.revealed&&i===cur.answer;
    return `<button type="button" class="opt${right?' right':''}" data-i="${i}" aria-pressed="${mine===i}" ${cur.open?'':'disabled'}>`+
      (cur.revealed?`<span class="bar" style="width:${pct}%"></span>`:'')+
      (ox?'':`<span class="no">${i+1}</span>`)+`<span>${esc(o)}${right?' ✓':''}</span>`+
      (cur.revealed?`<span class="pct">${pct}%</span>`:'')+`</button>`;
  }).join('');
  const m=$('#msg');
  if(cur.revealed){
    if(mine===undefined){ m.textContent=`정답은 ${ox?opts[cur.answer]:(cur.answer+1)+'번'}이에요. (응답 ${total}명)`; m.className='msg'; }
    else if(mine===cur.answer){ m.textContent=`정답이에요! (응답 ${total}명)`; m.className='msg ok'; }
    else { m.textContent=`정답은 ${ox?opts[cur.answer]:(cur.answer+1)+'번'}이에요. 다시 생각해 봐요. (응답 ${total}명)`; m.className='msg no'; }
  }else if(!cur.open){ m.textContent=mine===undefined?'응답이 마감됐어요.':'응답이 마감됐어요. 정답 공개를 기다려요.'; m.className='msg'; }
  else { m.textContent=mine===undefined?'답을 골라 눌러 주세요.':'제출했어요. 마감 전까지 바꿀 수 있어요.'; m.className=mine===undefined?'msg':'msg ok'; }
}

async function tick(){
  clearTimeout(timer);
  if(!P.cls){ render(); return; }
  try{ cur=await rpc('poll_current',{p_class:P.cls}); }
  catch(e){ if(!cur){ show('waitBox'); $('#waitText').textContent='서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요. 잠시 뒤 다시 시도해요.'; } }
  render();
  if(document.visibilityState==='visible') timer=setTimeout(tick,3000);
}

$('#cls').addEventListener('change',e=>{ P.cls=e.target.value; store(); cur=null; lastKey=''; tick(); });
$('#opts').addEventListener('click',async e=>{
  const b=e.target.closest('[data-i]'); if(!b||!cur||!cur.open||sending) return;
  const i=+b.dataset.i, session=cur.session; sending=true;
  try{
    await rpc('poll_vote',{p_class:P.cls,p_session:session,p_voter:P.voter,p_choice:i});
    P.mine={[session]:i}; store(); lastKey=''; render();
  }catch(err){
    const m=$('#msg'); m.className='msg no';
    m.textContent=err.code==='closed'?'응답이 마감됐어요.':err.code==='changed'?'질문이 바뀌었어요. 새 질문을 확인해 주세요.':err.code==='too_many'?'응답이 너무 많이 들어와 잠시 받을 수 없어요.':'제출하지 못했어요. 다시 눌러 주세요.';
    if(err.code==='changed'||err.code==='closed') tick();
  }finally{ sending=false; }
});
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') tick(); });
tick();
</script>
</body>
</html>
