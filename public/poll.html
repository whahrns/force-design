<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>힘 설계 설문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFDF5; --grid:transparent; --ink:#253044; --muted:#5B6275; --line:#B8B6C5; --card:#FFFFFF; --soft:#E9FFF5;
  --outline:transparent; --accent:#6434DF; --pink:#FF78C5; --amber:#FFD05B; --mint:#9BF1CD; --lav:#F1EBFF; --sky:#FFE6F4; --sel:#F1EBFF; --cushion:#F1EBFF; --focus:#6434DF;
  --on-accent:#FFFFFF;
  --g:#6434DF; --f:#8A5A00; --b:#0B7A55; --e:#C21F7A;
  --g-bg:#F1EBFF; --f-bg:#FFF3CC; --b-bg:#E9FFF5; --e-bg:#FFE6F4;
  --clay-tray:18px 22px 44px rgba(37,43,58,.14),inset 5px 5px 10px rgba(255,255,255,.85),inset -6px -7px 14px rgba(37,43,58,.07);
  --clay-surf:9px 11px 22px rgba(37,43,58,.14),inset 4px 4px 8px rgba(255,255,255,.65),inset -5px -6px 10px rgba(37,43,58,.08);
  --clay-ctl:4px 6px 12px rgba(37,43,58,.22),inset 3px 3px 5px rgba(255,255,255,.3),inset -3px -4px 6px rgba(37,43,58,.14);
  --clay-press:1px 2px 4px rgba(37,43,58,.2),inset 3px 4px 7px rgba(37,43,58,.25),inset -2px -2px 4px rgba(255,255,255,.3);
  --clay-well:inset 3px 4px 8px rgba(37,43,58,.14),inset -2px -2px 5px rgba(255,255,255,.8);
  --display:"Instrument Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Instrument Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#171A24; --grid:transparent; --ink:#EEF0F7; --muted:#A6ABBE; --line:#454B60; --card:#21263A; --soft:#17302A;
    --outline:transparent; --accent:#9B7BFF; --pink:#FF78C5; --amber:#FFD05B; --mint:#5FD9A9; --lav:#2C2550; --sky:#3F1A33; --sel:#2C2550; --cushion:#2C2550; --focus:#9B7BFF;
    --on-accent:#14121F;
    --g:#B39DFF; --f:#FFD05B; --b:#7BEBC2; --e:#FF8FD0;
    --g-bg:#2C2550; --f-bg:#3A300F; --b-bg:#14352B; --e-bg:#3F1A33;
    --clay-tray:14px 18px 36px rgba(0,0,0,.4),inset 4px 4px 9px rgba(255,255,255,.07),inset -6px -7px 14px rgba(0,0,0,.25);
    --clay-surf:8px 10px 20px rgba(0,0,0,.35),inset 3px 3px 7px rgba(255,255,255,.08),inset -5px -6px 10px rgba(0,0,0,.25);
    --clay-ctl:3px 5px 10px rgba(0,0,0,.4),inset 2px 2px 4px rgba(255,255,255,.25),inset -3px -4px 6px rgba(0,0,0,.25);
    --clay-press:1px 2px 4px rgba(0,0,0,.35),inset 3px 4px 7px rgba(0,0,0,.35),inset -2px -2px 4px rgba(255,255,255,.08);
    --clay-well:inset 3px 4px 8px rgba(0,0,0,.35),inset -2px -2px 5px rgba(255,255,255,.06);
  }
}
:root[data-theme="dark"]{
    --paper:#171A24; --grid:transparent; --ink:#EEF0F7; --muted:#A6ABBE; --line:#454B60; --card:#21263A; --soft:#17302A;
    --outline:transparent; --accent:#9B7BFF; --pink:#FF78C5; --amber:#FFD05B; --mint:#5FD9A9; --lav:#2C2550; --sky:#3F1A33; --sel:#2C2550; --cushion:#2C2550; --focus:#9B7BFF;
    --on-accent:#14121F;
    --g:#B39DFF; --f:#FFD05B; --b:#7BEBC2; --e:#FF8FD0;
    --g-bg:#2C2550; --f-bg:#3A300F; --b-bg:#14352B; --e-bg:#3F1A33;
    --clay-tray:14px 18px 36px rgba(0,0,0,.4),inset 4px 4px 9px rgba(255,255,255,.07),inset -6px -7px 14px rgba(0,0,0,.25);
    --clay-surf:8px 10px 20px rgba(0,0,0,.35),inset 3px 3px 7px rgba(255,255,255,.08),inset -5px -6px 10px rgba(0,0,0,.25);
    --clay-ctl:3px 5px 10px rgba(0,0,0,.4),inset 2px 2px 4px rgba(255,255,255,.25),inset -3px -4px 6px rgba(0,0,0,.25);
    --clay-press:1px 2px 4px rgba(0,0,0,.35),inset 3px 4px 7px rgba(0,0,0,.35),inset -2px -2px 4px rgba(255,255,255,.08);
    --clay-well:inset 3px 4px 8px rgba(0,0,0,.35),inset -2px -2px 5px rgba(255,255,255,.06);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  word-break:keep-all;overflow-wrap:break-word;line-break:strict;
}
h1{font-family:var(--display);font-weight:700;font-size:28px;margin:0 0 14px}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px 48px}
.note{font-size:14px;color:var(--muted)}
a{color:inherit}
</style>
</head>
<body data-poll-page>
<main class="wrap">
  <h1>📊 실시간 설문</h1>
  <div id="pollMount"></div>
  <p class="note" style="margin-top:16px">이름이나 학번은 묻지 않아요. 접속한 모두가 같은 질문을 보고, 응답 결과가 바로바로 바뀌어요. <a href="./">← 모둠 활동으로 돌아가기</a></p>
</main>
<script src="./draw-wheel.js"></script>
<script src="./poll-widget.js"></script>
</body>
</html>
