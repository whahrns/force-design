<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>힘 설계 설문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F7F5; --grid:#E0E8E3; --ink:#17232C; --muted:#56666F; --line:#C7D3CD; --card:#FFFFFF; --soft:#EAF0EC;
  --g:#3346A8; --b:#0A8683; --b-bg:#DDF2F1; --e:#C0306A;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10181D; --grid:#18232A; --ink:#E6EDEF; --muted:#9AAAB2; --line:#2C3A42; --card:#162127; --soft:#1B272E;
    --g:#8C9CFF; --b:#3FCFCB; --b-bg:#0E3533; --e:#FF7EAD;
  }
}
:root[data-theme="dark"]{
  --paper:#10181D; --grid:#18232A; --ink:#E6EDEF; --muted:#9AAAB2; --line:#2C3A42; --card:#162127; --soft:#1B272E;
  --g:#8C9CFF; --b:#3FCFCB; --b-bg:#0E3533; --e:#FF7EAD;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;
  word-break:keep-all;overflow-wrap:break-word;line-break:strict;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 14px}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px 48px}
.note{font-size:14px;color:var(--muted)}
a{color:inherit}
</style>
</head>
<body data-poll-page>
<main class="wrap">
  <h1>📊 실시간 설문</h1>
  <div id="pollMount"></div>
  <p class="note" style="margin-top:16px">이름이나 학번은 묻지 않아요. 접속한 모두가 같은 질문을 보고, 응답 결과가 바로바로 바뀌어요. <a href="./">← 모둠 활동으로 돌아가기</a></p>
</main>
<script src="./draw-wheel.js"></script>
<script src="./poll-widget.js"></script>
</body>
</html>
